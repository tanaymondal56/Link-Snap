apiVersion: apps/v1
kind: Deployment
metadata:
  name: linksnap-frontend
  labels:
    app: linksnap-frontend
spec:
  replicas: 0
  selector:
    matchLabels:
      app: linksnap-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: linksnap-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx default non-root UID in official nginx:alpine image
        runAsGroup: 101
        fsGroup: 101
      containers:
          # NOTE: In the new CF Pages + BFF architecture, the React SPA is served
          # by Cloudflare Pages and this frontend pod is NO LONGER required.
          # This deployment is kept for:
          #   a) Local Docker/K8s testing without CF Pages.
          #   b) Fallback if CF Pages is unavailable.
          # Scaled to 0 replicas in production by default.
        - name: frontend
          image: tanaymondal/linksnap-frontend:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      # No imagePullSecrets needed — Docker Hub public registry
      # imagePullSecrets:
      #   - name: registry-credentials
