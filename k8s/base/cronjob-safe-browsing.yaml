apiVersion: batch/v1
kind: CronJob
metadata:
  name: linksnap-safe-browsing-scan
spec:
  schedule: "0 */4 * * *"          # Every 4 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: linksnap-cronjob
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000      # Matches UID of 'linksnap' user created in server/Dockerfile
            runAsGroup: 1000
          containers:
            - name: safe-browsing
              image: tanaymondal/linksnap-backend:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["node", "scripts/runSafeBrowsingScan.js"]
              envFrom:
                - configMapRef:
                    name: linksnap-config
                - secretRef:
                    name: linksnap-secrets
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/linksnap
          volumes:
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
