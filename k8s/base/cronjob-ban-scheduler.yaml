apiVersion: batch/v1
kind: CronJob
metadata:
  name: linksnap-ban-scheduler
spec:
  schedule: "*/5 * * * *"          # Every 5 minutes
  concurrencyPolicy: Forbid         # Don't overlap if previous run is still going
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: linksnap-cronjob
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000      # Matches UID of 'linksnap' user created in server/Dockerfile
            runAsGroup: 1000
          containers:
            - name: ban-scheduler
              image: tanaymondal/linksnap-backend:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["node", "scripts/runBanScheduler.js"]
              envFrom:
                - configMapRef:
                    name: linksnap-config
                - secretRef:
                    name: linksnap-secrets
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
