# Ensures at least 1 tunnel pod is always available during:
# - Node drains (kubectl drain)
# - K3s upgrades
# - OCI maintenance events
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-tunnel-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared-tunnel
