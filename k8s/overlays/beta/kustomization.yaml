apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linksnap-beta
resources:
  - ../../base
  - namespace.yaml

images:
  - name: tanaymondal/linksnap-backend
    newName: tanaymondal/linksnap-backend-beta
    newTag: beta
  - name: tanaymondal/linksnap-frontend
    newName: tanaymondal/linksnap-frontend-beta
    newTag: beta

patches:
  - target:
      kind: Deployment
      name: linksnap-backend
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
# WHY Recreate IN BETA (intentional downtime — do not "fix" back to RollingUpdate):
# Beta pods share dev/beta Redis and Cosmos state. Running old and new app versions
# concurrently during a rolling update caused mixed-schema writes and confusing
# beta test results. Recreate guarantees only ONE version touches state at a time.
# Brief unavailability is acceptable in staging; production keeps maxUnavailable: 0
# RollingUpdate for zero-downtime deploys.
